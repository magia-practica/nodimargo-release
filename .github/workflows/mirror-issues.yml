name: Mirror issues to private repo

on:
  issues:
    types: [opened]

permissions: {}

env:
  PRIVATE_REPO: magia-practica/nodiMargo
  MIRROR_LABEL: public-report

jobs:
  mirror:
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Create mirrored issue
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          # Untrusted input: passed via env, never interpolated into the script.
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          AUTHOR: ${{ github.event.issue.user.login }}
          URL: ${{ github.event.issue.html_url }}
          NUMBER: ${{ github.event.issue.number }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create "$MIRROR_LABEL" --repo "$PRIVATE_REPO" \
            --color 0E8A16 --description "Mirrored from public release repo" --force

          {
            printf '> Mirrored from %s (opened by `%s`)\n\n' "$URL" "$AUTHOR"
            printf '%s\n\n' "$BODY"
            printf '<!-- mirrored-from: %s#%s -->\n' "$SOURCE_REPO" "$NUMBER"
          } > body.md

          gh issue create --repo "$PRIVATE_REPO" \
            --title "$TITLE" --body-file body.md --label "$MIRROR_LABEL"
